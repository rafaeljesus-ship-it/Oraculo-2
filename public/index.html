<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oráculo de Pré-Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta Flash */
    --rosa-flash: #FE2B8F;
    --rosa-dark-1: #E6007C;
    --rosa-dark-2: #A60058;
    --rosa-light-1: #FFECF2;
    --rosa-light-2: #FF9ABD;
    --rosa-light-3: #FF6D94;
    --despesas: #D63275;
    --pessoas: #FFC2D0;
    --neutral-900: #333333;
    --neutral-700: #5c5c5c;
    --neutral-300: #D9D9D9;
    --neutral-200: #C9C8C9;
    --white: #FFFFFF;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, var(--rosa-light-1) 0%, #fff 320px);
    color: var(--neutral-900);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 640px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--rosa-flash);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: "Fustat", sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .brand-name {
    font-family: "Fustat", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--rosa-dark-2);
    letter-spacing: 0.02em;
  }

  h1 {
    font-family: "Fustat", sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    margin: 0 0 6px;
    color: var(--neutral-900);
  }
  .subtitle {
    color: var(--neutral-700);
    margin-bottom: 28px;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  form {
    background: var(--white);
    border: 1px solid var(--neutral-300);
    border-radius: 16px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 8px 24px rgba(254, 43, 143, 0.08);
  }
  label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--neutral-900);
    display: block;
    margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%;
    background: #fafafa;
    border: 1.5px solid var(--neutral-300);
    color: var(--neutral-900);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--rosa-flash);
    background: var(--white);
  }
  .field.required label::after {
    content: " *";
    color: var(--rosa-flash);
  }
  button {
    background: var(--rosa-flash);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 13px 16px;
    font-size: 1rem;
    font-weight: 700;
    font-family: "Fustat", sans-serif;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: var(--rosa-dark-1); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.55; cursor: wait; }

  #resultado {
    margin-top: 20px;
    background: var(--white);
    border: 1px solid var(--neutral-300);
    border-left: 4px solid var(--rosa-flash);
    border-radius: 12px;
    padding: 22px;
    display: none;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 0.95rem;
  }
  #resultado.visible { display: block; }
  #resultado strong { color: var(--rosa-dark-1); }

  .status {
    font-size: 0.85rem;
    color: var(--neutral-700);
    margin-top: 4px;
    display: none;
  }
  .status.visible { display: block; }
  .status.error { color: var(--danger); }

  .bu-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: white;
    background: var(--rosa-flash);
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
  }

  footer {
    margin-top: 28px;
    color: var(--neutral-700);
    font-size: 0.78rem;
    text-align: center;
  }

  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(180deg, #2a1420 0%, #15161a 320px); color: #f0f0f0; }
    form { background: #1d1e24; border-color: #33343c; }
    input, select, textarea { background: #15161a; border-color: #33343c; color: #f0f0f0; }
    input:focus, select:focus, textarea:focus { background: #1d1e24; }
    #resultado { background: #1d1e24; border-color: #33343c; }
    .subtitle, .status { color: #b9b9c0; }
    h1 { color: #f5f5f5; }
    label { color: #e4e4e8; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="brand-mark">F</div>
    <div class="brand-name">FLASH</div>
  </div>

  <h1>🔮 Oráculo de Pré-Vendas</h1>
  <p class="subtitle">
    Consulte a política de abordagem, duplicidade de negócio, motivos de
    perdido ou regras de prospecção. Caminho alternativo ao formulário do
    Slack — use quando o Slack não estiver disponível.
  </p>

  <form id="form-oraculo">
    <div class="field required">
      <label for="solicitante">Solicitante</label>
      <input type="text" id="solicitante" name="solicitante" placeholder="Seu nome" required />
    </div>

    <div class="field required">
      <label for="time">Time</label>
      <select id="time" name="time" required>
        <option value="" disabled selected>Selecione</option>
        <option>BDR Outbound</option>
        <option>SDR Inbound</option>
        <option>BDR Farming</option>
        <option>Vendas</option>
        <option>AM</option>
        <option>Canais</option>
        <option>Pós-venda</option>
      </select>
    </div>

    <div class="field required">
      <label for="bu">BU</label>
      <select id="bu" name="bu" required>
        <option value="" disabled selected>Selecione</option>
        <option>Benefícios</option>
        <option>Despesas</option>
        <option>Pessoas</option>
      </select>
    </div>

    <div class="field">
      <label for="tier">Tier (se souber)</label>
      <select id="tier" name="tier">
        <option value="" selected>Não sei / prefiro não informar</option>
        <option>T0</option>
        <option>T1</option>
        <option>T2</option>
        <option>T3</option>
        <option>T4</option>
        <option>T5</option>
        <option>T6 / Enterprise</option>
      </select>
    </div>

    <div class="field required">
      <label for="tipoDuvida">Tipo de dúvida</label>
      <select id="tipoDuvida" name="tipoDuvida" required>
        <option value="" disabled selected>Selecione</option>
        <option value="Posso abordar essa empresa?">Posso abordar essa empresa?</option>
        <option value="Duplicidade de negócio">Duplicidade de negócio</option>
        <option value="Motivo de perdido">Motivo de perdido</option>
        <option value="Regra de prospecção">Regra de prospecção</option>
      </select>
    </div>

    <div class="field required">
      <label for="linkHubspot">Link da empresa/negócio no HubSpot</label>
      <input type="url" id="linkHubspot" name="linkHubspot"
             placeholder="https://app.hubspot.com/contacts/.../record/0-3/..." required />
    </div>

    <div class="field">
      <label for="contexto">Contexto adicional</label>
      <textarea id="contexto" name="contexto" placeholder="Qualquer informação extra relevante para o caso"></textarea>
    </div>

    <div class="field">
      <label for="codigoAcesso">Código de acesso (se exigido)</label>
      <input type="password" id="codigoAcesso" name="codigoAcesso" autocomplete="off" />
    </div>

    <button type="submit" id="btn-enviar">Consultar Oráculo</button>
    <div class="status" id="status"></div>
  </form>

  <div id="resultado"></div>

  <footer>Oráculo de Pré-Vendas · Flash · uso interno</footer>
</main>

<script>
  const form = document.getElementById("form-oraculo");
  const resultado = document.getElementById("resultado");
  const status = document.getElementById("status");
  const btn = document.getElementById("btn-enviar");

  function showStatus(msg, isError) {
    status.textContent = msg;
    status.className = "status visible" + (isError ? " error" : "");
  }

  function hideStatus() {
    status.className = "status";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideStatus();
    resultado.className = "";
    resultado.textContent = "";

    const payload = {
      Solicitante: form.solicitante.value,
      Time: form.time.value,
      BU: form.bu.value,
      Tier: form.tier.value,
      "Tipo de dúvida": form.tipoDuvida.value,
      "Link HubSpot": form.linkHubspot.value,
      Contexto: form.contexto.value,
    };

    btn.disabled = true;
    btn.textContent = "Consultando...";
    showStatus("Consultando o CRM e aplicando as regras — isso pode levar alguns segundos.");

    try {
      const res = await fetch("/api/consulta", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Access-Code": form.codigoAcesso.value,
        },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Erro desconhecido");
      }

      resultado.textContent = data.verdict;
      resultado.className = "visible";
      hideStatus();
    } catch (err) {
      showStatus("Erro ao consultar: " + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Consultar Oráculo";
    }
  });
</script>
</body>
</html>
